name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Install .NET MAUI Android Workload
      run: dotnet workload install maui-android

    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'microsoft'
        java-version: '17'

    - name: Restore dependencies
      run: dotnet restore SK70Planering/SK70Planering.csproj -p:CheckEolTargetFramework=false

    - name: Build Android APK
      run: dotnet build SK70Planering/SK70Planering.csproj -f net8.0-android -c Release -p:AndroidPackageFormat=apk -p:EmbedAssembliesIntoApk=true -p:CheckEolTargetFramework=false

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SK70Planering-Android-APK
        path: SK70Planering/bin/**/net8.0-android/*.apk
